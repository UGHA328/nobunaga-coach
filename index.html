<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>노부나가 편성 코치</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2a2f3a;--txt:#e6e8ee;--muted:#9aa3b2;--accent:#d9a441;--accent2:#5b8def;--red:#e0574b;--green:#4cae7a;--purple:#9a7bd8;--blue:#5b8def;--orange:#e08a3c}
  :root[data-theme="light"]{--bg:#f5f4f0;--panel:#fff;--panel2:#f0efe9;--line:#e2ddd2;--txt:#1d2129;--muted:#6b7280}
  :root[data-theme="sepia"]{--bg:#f4ecd8;--panel:#fbf5e6;--panel2:#efe4cc;--line:#ddcba8;--txt:#3b2f1e;--muted:#8a785a;--accent:#b07a2e;--accent2:#7a5c3a;--green:#5a7d3a;--purple:#8a6d3a}
  :root[data-theme="blue"]{--bg:#0b1220;--panel:#121a2b;--panel2:#172236;--line:#263349;--txt:#e6ecf5;--muted:#8fa0bd;--accent:#4ea1ff;--accent2:#6cc0ff}

  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;line-height:1.5}
  .wrap{max-width:1000px;margin:0 auto;padding:16px}h1{font-size:20px;margin:0 0 2px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
  .card h2{font-size:15px;margin:0 0 10px}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
  input,select,textarea,button{font-family:inherit;font-size:14px}
  input[type=text],select,textarea{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px 10px;outline:none}
  textarea{resize:vertical;min-height:60px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>div{flex:1;min-width:130px}
  button{cursor:pointer;border:none;border-radius:8px;padding:10px 16px;font-weight:700}
  .btn-primary{background:var(--accent);color:#1a1200}.btn-primary:disabled{opacity:.5;cursor:not-allowed}
  .btn-ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line);font-weight:600}
  .chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--txt)}.chk input{width:auto}
  .legion{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel2)}
  .legion-title{font-weight:800;font-size:14px;margin-bottom:8px}
  .units{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}@media(max-width:640px){.units{grid-template-columns:1fr}}
  .unit{border:1px solid var(--line);border-radius:8px;padding:7px;background:var(--panel)}
  .unit .u-label{font-size:11px;color:var(--muted);margin-bottom:5px}
  .slot{margin-bottom:6px}.slot select{margin-bottom:2px;padding:6px 7px;font-size:12.5px}.slot select.jusang{border-color:var(--accent2)}
  .ownchk{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}.ownchk input{width:auto;margin:0}
  .pill{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:700}
  .p-기병{background:rgba(224,138,60,.18);color:var(--orange)}.p-총포{background:rgba(154,123,216,.18);color:var(--purple)}.p-창병{background:rgba(91,141,239,.18);color:var(--blue)}.p-닌자{background:rgba(76,174,122,.18);color:var(--green)}
  .legtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .legtab{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:6px 12px;font-weight:700;font-size:13px}
  .legtab.on{background:var(--accent);color:#1a1200;border-color:var(--accent)}
  .zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .dz{border:2px dashed var(--line);border-radius:8px;padding:12px;text-align:center;color:var(--muted);cursor:pointer;background:var(--panel2);font-size:12px}.dz.over{border-color:var(--accent);color:var(--accent)}
  .th{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.thumb{position:relative}.thumb img{height:78px;border-radius:6px;border:1px solid var(--line);display:block}
  .thumb .x{position:absolute;top:-7px;right:-7px;background:var(--red);color:#fff;border-radius:50%;width:20px;height:20px;line-height:18px;text-align:center;font-size:12px;cursor:pointer;border:2px solid var(--panel)}
  .guide{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .g-item{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--panel2);font-size:12.5px}.g-item .n{font-weight:800;color:var(--accent);margin-bottom:4px}
  #chat{max-height:620px;overflow-y:auto}.bubble{border-radius:10px;padding:10px 12px;margin:8px 0}
  .bubble.user{background:var(--panel2);border:1px solid var(--line);font-size:13.5px;color:var(--muted)}.bubble.ai{background:var(--panel2);border:1px solid var(--accent2)}
  .ai-body{overflow-x:auto}.ai-body h1,.ai-body h2{font-size:16px;margin:14px 0 8px}.ai-body h3{font-size:15px;margin:12px 0 6px;color:var(--accent)}
  .ai-body ul,.ai-body ol{margin:6px 0 6px 20px;padding:0}.ai-body li{margin:3px 0}.ai-body p{margin:6px 0}.ai-body strong{color:var(--txt)}
  .ai-body table{border-collapse:collapse;margin:8px 0;font-size:13px;width:100%}.ai-body th,.ai-body td{border:1px solid var(--line);padding:5px 8px;text-align:left}.ai-body th{background:var(--panel)}
  .hint{font-size:11.5px;color:var(--muted);margin-top:6px}.note{font-size:12px;color:var(--green);margin-top:6px}
  .spinner{display:inline-block;width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}}
  a{color:var(--accent2)}
  .rules{font-size:13px;line-height:1.85}.rules b{color:var(--accent)}.rules .r{margin:7px 0;padding-left:18px;position:relative}.rules .r::before{content:"▸";position:absolute;left:0;color:var(--accent2)}
  .dbfilters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.dbfilters input{flex:2;min-width:150px}.dbfilters select{flex:1;min-width:100px}
  #dbWrap{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:8px}
  #dbTable{border-collapse:collapse;font-size:12px;width:100%}#dbTable th,#dbTable td{border:1px solid var(--line);padding:4px 7px;text-align:left;vertical-align:top;white-space:nowrap}
  #dbTable td.wrap{white-space:normal;min-width:170px}#dbTable th{background:var(--panel2);position:sticky;top:0;z-index:1}
  .muted{color:var(--muted);font-size:11px}.tagY{color:var(--green);font-weight:700}.tagN{color:var(--muted)}
  summary.fold{cursor:pointer;font-size:15px;font-weight:700;list-style:none;outline:none}
  summary.fold::-webkit-details-marker{display:none}
  summary.fold::before{content:"▸ ";color:var(--accent2)}
  details[open] summary.fold::before{content:"▾ "}
</style>
</head>
<body><div class="wrap">
<h1 data-i18n="appTitle"></h1>
<div class="sub" data-i18n="appSub"></div>

<div class="card"><h2 data-i18n="setTitle"></h2>

    <div><label data-i18n="langLabel"></label><select id="langSel"><option value="ko">한국어</option><option value="en">English</option><option value="zh">中文</option></select></div>

  </div>

  <div class="hint" data-i18n="keyNote"></div>
</div>

<div class="card"><h2 data-i18n="legTitle"></h2><div class="hint" data-i18n="legHint" style="margin:-4px 0 8px"></div><div id="legTabs" class="legtabs"></div><div id="legions"></div><button class="btn-ghost" id="resetBtn" data-i18n="resetBtn" style="margin-top:10px"></button></div>

<div class="card"><h2 data-i18n="optTitle"></h2>

    <button class="btn-primary" id="optBtn" data-i18n="optBtn"></button>
  </div>
  <div class="hint" data-i18n="optHint"></div>
</div>

<div class="card"><h2 data-i18n="qTitle"></h2>

    <div><label data-i18n="targetLabel"></label><select id="target"></select></div>
    <div><label data-i18n="candLabel"></label><select id="cand"></select><label class="ownchk" id="candOwnWrap" style="display:none;margin-top:6px"><input type="checkbox" id="candOwn"> <span data-i18n="own"></span></label></div>

      <div><label data-i18n="z2"></label><div class="dz" id="dz-스킬">📷<input type="file" id="fi-스킬" accept="image/*" multiple hidden></div><div class="th" id="th-스킬"></div></div>
      <div><label data-i18n="z3"></label><div class="dz" id="dz-전무">📷<input type="file" id="fi-전무" accept="image/*" multiple hidden></div><div class="th" id="th-전무"></div></div>
    </div>
  </div>
  <div style="margin-top:10px"><label data-i18n="qLabel"></label><textarea id="q"></textarea></div>
  <div style="margin-top:10px"><button class="btn-primary" id="askBtn" data-i18n="askBtn"></button></div>
  <div id="addNote"></div>
</div>

<div class="card"><h2 data-i18n="guideTitle"></h2>
  <div class="guide">
    <div class="g-item"><div class="n" data-i18n="g1t"></div><span data-i18n="g1d"></span></div>
    <div class="g-item"><div class="n" data-i18n="g2t"></div><span data-i18n="g2d"></span></div>
    <div class="g-item"><div class="n" data-i18n="g3t"></div><span data-i18n="g3d"></span></div>
    <div class="g-item"><div class="n" data-i18n="g4t"></div><span data-i18n="g4d"></span></div>
  </div>
  <div class="hint" data-i18n="guideHint"></div>
</div>

<div class="card"><h2 data-i18n="chatTitle"></h2><div id="chat"></div>
  <div id="followRow" style="display:none;margin-top:12px"><label data-i18n="followLabel"></label><div style="display:flex;gap:8px"><input type="text" id="followInput"><button class="btn-primary" id="followBtn" data-i18n="sendBtn" style="white-space:nowrap"></button></div></div>
</div>

<div class="card"><details><summary class="fold" data-i18n="rulesTitle"></summary><div class="rules" style="margin-top:10px">
  <div class="r" data-i18n="r1"></div><div class="r" data-i18n="r2"></div><div class="r" data-i18n="r3"></div><div class="r" data-i18n="r4"></div><div class="r" data-i18n="r5"></div><div class="r" data-i18n="r6"></div>
</div></details></div>

<div class="card"><h2><span data-i18n="dbTitle"></span> <span class="hint" style="font-weight:400">(<span id="dbCount">59</span>)</span></h2>

    <select id="dbByeong"><option value="" data-i18n="byAll"></option><option value="기병" data-i18n="c기병"></option><option value="총포" data-i18n="c총포"></option><option value="창병" data-i18n="c창병"></option><option value="닌자" data-i18n="c닌자"></option></select>

  </div>
  <div id="dbWrap"><table id="dbTable"></table></div>
</div>
</div>

let lang=localStorage.getItem("nob_lang")||"ko";
function t(k){return (UI[lang]&&UI[lang][k]!=null)?UI[lang][k]:(UI.ko[k]!=null?UI.ko[k]:k)}
const LANGNAME={ko:"한국어",en:"English",zh:"简体中문".replace("문","文")};

/* ===== 장수 데이터 번역 캐시 (Gemini) ===== */
let TR={en:JSON.parse(localStorage.getItem("nob_tr_en")||"{}"),zh:JSON.parse(localStorage.getItem("nob_tr_zh")||"{}")};
function dg(g,f){if(lang==="ko")return g[f];const o=TR[lang]&&TR[lang][g.번호];return (o&&o[f])?o[f]:g[f]}
async function ensureTr(lg){if(lg==="ko")return;const miss=ALL().filter(g=>!TR[lg][g.번호]);if(!miss.length)return;const langN=lg==="en"?"English":"Simplified Chinese";const nameRule=lg==="en"?"standard historical romanization (e.g., Takeda Shingen, Sanada Yukimura)":"standard Chinese characters (e.g., 武田信玄)";const schema={type:"ARRAY",items:{type:"OBJECT",properties:{번호:{type:"NUMBER"},이름:{type:"STRING"},스킬:{type:"STRING"},스킬효과:{type:"STRING"},무기:{type:"STRING"},무기효과:{type:"STRING"},전보:{type:"STRING"}},required:["번호"]}};const src=miss.map(g=>`${g.번호}||${g.이름}||${g.스킬}||${g.스킬효과}||${g.무기}||${g.무기효과}||${g.전보}`).join("\n");const prompt=`Translate these 'Nobunaga's Ambition' mobile-game general entries to ${langN}. Names use ${nameRule}. Translate skill/weapon names and effect texts naturally as game text (keep it concise). Return a JSON array; for each line output 번호 and the translated 이름,스킬,스킬효과,무기,무기효과,전보 (if a field is empty keep empty). Lines are '번호||이름||스킬||스킬효과||무기||무기효과||전보':\n${src}`;const arr=JSON.parse(await gemini(modelEl.value,[{role:"user",parts:[{text:prompt}]}],schema));arr.forEach(o=>{if(o.번호!=null)TR[lg][o.번호]=o});localStorage.setItem("nob_tr_"+lg,JSON.stringify(TR[lg]))}

/* 사용자 추가 장수 */
let userDB=JSON.parse(localStorage.getItem("nob_userdb")||"[]");
function ALL(){return BASE_G.concat(userDB)}
function hasWeapon(g){return (g.무기&&g.무기!=="없음"&&g.무기!=="")?"보유":"없음"}
function findGen(name){return ALL().find(g=>g.이름===name)}
let legions=JSON.parse(localStorage.getItem("nob_legions")||"null")||structuredClone(DEFAULT_LEGIONS);
legions.forEach(L=>{if(!L.own)L.own=L.units.map(u=>u.map(n=>{const g=findGen(n);return !!(g&&hasWeapon(g)==="보유")}))});
let curLeg=0;
const shots={기본:[],스킬:[],전무:[]};

/* ===== 편성 렌더 ===== */
function byName(a,b){return dg(a,"이름").localeCompare(dg(b,"이름"),lang)}
function optionList(f,sel){return ALL().filter(f).sort(byName).map(g=>`<option value="${g.이름}" ${g.이름===sel?"selected":""}>${dg(g,"이름")} (${g.통솔}/${g.무용}/${g.지략})</option>`).join("")}
function saveLeg(){localStorage.setItem("nob_legions",JSON.stringify(legions))}
function legName(L){return BYICON[L.병종]+" "+t("c"+L.병종)}
function renderLegions(){const tb=document.getElementById("legTabs");tb.innerHTML=legions.map((L,i)=>`<button class="legtab ${i===curLeg?'on':''}" data-i="${i}">${legName(L)}</button>`).join("");tb.querySelectorAll(".legtab").forEach(b=>b.addEventListener("click",e=>{curLeg=+e.currentTarget.dataset.i;renderLegions()}));const L=legions[curLeg],li=curLeg,el=document.getElementById("legions");el.innerHTML=`<div class="legion"><div class="legion-title">${legName(L)} <span class="pill p-${L.병종}">${t("c"+L.병종)}</span></div><div class="units">${L.units.map((u,ui)=>`<div class="unit"><div class="u-label">${ui+1}</div>${[0,1,2].map(si=>`<div class="slot"><select class="${si===0?'jusang':''}" data-u="${ui}" data-s="${si}">${optionList(si===0?(g=>g.역할==="주장"&&g.병종===L.병종):(g=>g.역할==="부장"),u[si])}</select><label class="ownchk"><input type="checkbox" data-u="${ui}" data-s="${si}" ${L.own[ui][si]?"checked":""}> ${t("own")}</label></div>`).join("")}</div>`).join("")}</div></div>`;el.querySelectorAll("select").forEach(s=>s.addEventListener("change",e=>{const u=+e.target.dataset.u,si=+e.target.dataset.s;legions[li].units[u][si]=e.target.value;legions[li].own[u][si]=hasWeapon(findGen(e.target.value))==="보유";saveLeg();renderLegions();renderTargets()}));el.querySelectorAll(".ownchk input").forEach(c=>c.addEventListener("change",e=>{const u=+e.target.dataset.u,si=+e.target.dataset.s;legions[li].own[u][si]=e.target.checked;saveLeg()}));renderTargets()}
function renderTargets(){const el=document.getElementById("target");const cur=el.value;const L=legions[curLeg],li=curLeg;let h=`<option value="">${t("tAll")}</option>`;L.units.forEach((u,ui)=>{h+=`<option value="${li}-${ui}">${legName(L)} ${ui+1} : ${u.map(n=>{const g=findGen(n);return g?dg(g,"이름"):n}).join(" / ")}</option>`});el.innerHTML=h;if(cur&&cur.indexOf(li+"-")===0)el.value=cur}

/* ===== 카테고리 스샷 + 후보 ===== */
const CATS=["기본","스킬","전무"];
function wireZone(cat){const dz=document.getElementById("dz-"+cat),fi=document.getElementById("fi-"+cat);dz.addEventListener("click",()=>fi.click());["dragover"].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add("over")}));["dragleave","drop"].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove("over")}));dz.addEventListener("drop",e=>{[...e.dataTransfer.files].forEach(f=>addShot(cat,f))});fi.addEventListener("change",e=>{[...e.target.files].forEach(f=>addShot(cat,f));fi.value=""})}
function addShot(cat,f){if(!f||!f.type.startsWith("image/"))return;const r=new FileReader();r.onload=()=>{shots[cat].push({data:r.result.split(",")[1],mime:f.type||"image/jpeg",url:r.result});renderShots()};r.readAsDataURL(f)}
function renderShots(){CATS.forEach(cat=>{const el=document.getElementById("th-"+cat);el.innerHTML=shots[cat].map((im,i)=>`<div class="thumb"><img src="${im.url}"><div class="x" data-c="${cat}" data-i="${i}">✕</div></div>`).join("");el.querySelectorAll(".x").forEach(x=>x.addEventListener("click",e=>{shots[e.target.dataset.c].splice(+e.target.dataset.i,1);renderShots()}))})}
CATS.forEach(wireZone);
function allShots(){return shots.기본.concat(shots.스킬,shots.전무)}
const candEl=document.getElementById("cand");
function fillCand(){const cur=candEl.value;candEl.innerHTML=`<option value="">${t("selCand")}</option>`+ALL().slice().sort(byName).map(g=>`<option value="${g.이름}">${dg(g,"이름")} (${t(g.역할==="주장"?"jusang":"busang")}${g.병종?"·"+t("c"+g.병종):""})</option>`).join("")+`<option value="__new__">${t("addNew")}</option>`;if(cur)candEl.value=cur}
candEl.addEventListener("change",()=>{const v=candEl.value;document.getElementById("newGenBox").style.display=v==="__new__"?"block":"none";const wrap=document.getElementById("candOwnWrap"),g=(v&&v!=="__new__")?findGen(v):null;if(g&&hasWeapon(g)==="보유"){wrap.style.display="inline-flex";document.getElementById("candOwn").checked=true}else{wrap.style.display="none"}});

/* ===== 언어 적용 ===== */
const langSel=document.getElementById("langSel");
function applyUI(){document.querySelectorAll("[data-i18n]").forEach(e=>{e.innerHTML=t(e.getAttribute("data-i18n"))});document.querySelectorAll("[data-i18n-ph]").forEach(e=>{e.placeholder=t(e.getAttribute("data-i18n-ph"))});document.documentElement.lang=lang;document.title=t("appTitle");const qEl=document.getElementById("q");if(!qEl.value||qEl.dataset.def==="1"){qEl.value=t("qDefault");qEl.dataset.def="1"}document.getElementById("followInput").placeholder=t("followPh");if(!uiTurns.length)document.getElementById("chat").innerHTML=`<span class="hint">${t("chatEmpty")}</span>`}
async function applyLang(lg){lang=lg;localStorage.setItem("nob_lang",lg);langSel.value=lg;applyUI();if(lg!=="ko"){const note=document.getElementById("addNote");const busy=`<span class="spinner"></span>${t("translating")}`;document.getElementById("dbCount").textContent="…";try{await ensureTr(lg)}catch(e){}}renderLegions();renderDB();fillCand()}
langSel.addEventListener("change",()=>applyLang(langSel.value));

/* ===== 프롬프트 ===== */
function dbLines(){return ALL().map(g=>`${g.번호}.${g.이름}|${g.역할}${g.병종?"·"+g.병종:""}|통${g.통솔}무${g.무용}지${g.지략}속${g.속도}정${g.정치}|${g.스킬}(${g.스킬효과})|무기:${g.무기||"없음"}${g.무기효과?"("+g.무기효과+")":""}${g.전보?"|전보:"+g.전보:""}`).join("\n")}
function ownTxt(L,ui,si){return (L.own&&L.own[ui]&&L.own[ui][si])?"[전무보유]":"[전무없음]"}
function compText(){return legions.map(L=>`${L.병종}군단\n`+L.units.map((u,ui)=>`  ${ui+1}부대: 주장 ${u[0]}${ownTxt(L,ui,0)} / ${u[1]}${ownTxt(L,ui,1)} / ${u[2]}${ownTxt(L,ui,2)}`).join("\n")).join("\n")}
const RULES=`[편성 규칙]\n- 군단=3부대, 부대=주장1+부장2(총9명). 3부대는 같은 병종(주장이 결정).\n- 주장 전용은 부장불가. 부장은 통재형만.\n- 부장은 주장 스킬 테마에 맞을수록 시너지(패주주장→패주강화, 작열주장→작열강화, 무용딜주장→무용딜증폭).\n- 무기(전용장비) 시너지, 특히 군단전체버프 무기 고가치.\n- 전보=실전관측(표본적음).`;
function answerLang(){return `\n[중요] 반드시 ${LANGNAME[lang]}(으)로 답변하세요.`}
function buildAdvicePrompt(){const ts=document.getElementById("target").value;let tt="(미지정)";if(ts){const[li,ui]=ts.split("-").map(Number);tt=`${legions[li].병종}군단 ${ui+1}부대 (현재: ${legions[li].units[ui].join(" / ")})`}const q=document.getElementById("q").value.trim();const cand=candEl.value;let candTxt;if(cand==="__new__")candTxt="첨부 스크린샷의 신규 장수. 이미지에서 이름/스탯/스킬/무기 확인. 전무 보유여부는 장비 마름모(빨강=보유)로 판단.";else if(cand){const g=findGen(cand);let own="";if(g){if(hasWeapon(g)==="보유")own=document.getElementById("candOwn").checked?"전무 보유함":"전무 미보유(장착 안됨)";else own="전용무기 없는 장수";}candTxt=g?`${g.이름} (${g.역할}${g.병종?"·"+g.병종:""}, 통${g.통솔}무${g.무용}지${g.지략}속${g.속도}정${g.정치}, 스킬:${g.스킬}(${g.스킬효과}), 무기:${g.무기}, ${own})`:cand}else candTxt="(미지정)";let ocrTxt=window._ocrText?`\n[OCR 보조]\n${window._ocrText}`:"";return `당신은 '신 노부나가의 야망' 편성 전문 코치입니다. 근거있게 조언.\n${RULES}\n[전체 DB]\n${dbLines()}\n[현재 편성(전무보유 표기)]\n${compText()}\n[질문 대상 부대] ${tt}\n[교체(추가) 후보] ${candTxt}\n[질문] ${q||"(후보를 대상부대에 넣을지 판단·구성조언)"}${ocrTxt}\n순서: 1.후보 확정 2.투입판단(넣는다/안넣는다 명확히, 근거:병종적합·주장스킬시너지·무기·스탯·전보·전무보유) 3.구성제안(넣으면 누구빼고 최종3인, 안넣으면 대안). 마크다운.${answerLang()}`}

/* ===== Gemini ===== */
async function gemini(model,contents,jsonSchema){const body={contents,generationConfig:{temperature:0.4,maxOutputTokens:jsonSchema?4096:2048}};if(jsonSchema){body.generationConfig.responseMimeType="application/json";body.generationConfig.responseSchema=jsonSchema}const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(GEMINI_KEY)}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const data=await res.json();if(!res.ok)throw new Error((data.error&&data.error.message)||("HTTP "+res.status));return data.candidates?.[0]?.content?.parts?.map(p=>p.text).join("")||""}
function imgParts(){return allShots().map(im=>({inline_data:{mime_type:im.mime,data:im.data}}))}
const GEN_SCHEMA={type:"ARRAY",items:{type:"OBJECT",properties:{이름:{type:"STRING"},역할:{type:"STRING"},특성:{type:"STRING"},병종:{type:"STRING"},통솔:{type:"NUMBER"},무용:{type:"NUMBER"},지략:{type:"NUMBER"},속도:{type:"NUMBER"},정치:{type:"NUMBER"},스킬:{type:"STRING"},스킬효과:{type:"STRING"},무기:{type:"STRING"},무기효과:{type:"STRING"},무기보유:{type:"STRING"}},required:["이름","역할"]}};
async function extractAndAdd(model){const prompt=`다음 이미지들은 '신 노부나가의 야망' 장수 정보 화면입니다. 각 장수를 JSON배열로: 이름,역할(주장/부장),특성(무용/지략/통재),병종(주장이면 기병/총포/창병/닌자,부장이면 빈문자),통솔/무용/지략/속도/정치(숫자),스킬,스킬효과,무기(없으면'없음'),무기효과,무기보유(마름모 빨강=보유/검정=없음). 같은 장수면 합치세요. (한국어로 값 작성)`;const contents=[{role:"user",parts:[{text:prompt},...imgParts()]}];let arr;try{arr=JSON.parse(await gemini(model,contents,GEN_SCHEMA))}catch(e){return[]}if(!Array.isArray(arr))return[];const added=[];arr.forEach(g=>{if(!g.이름||findGen(g.이름))return;userDB.push({번호:1000+userDB.length,이름:g.이름,역할:g.역할==="주장"?"주장":"부장",특성:g.특성||"통재",병종:g.역할==="주장"?(g.병종||""):"",통솔:+g.통솔||0,무용:+g.무용||0,지략:+g.지략||0,속도:+g.속도||0,정치:+g.정치||0,스킬:g.스킬||"",스킬효과:g.스킬효과||"",무기:(g.무기&&g.무기!=="없음")?g.무기:"없음",무기효과:g.무기효과||"",전보:"",출처:"user",무기보유:g.무기보유||""});added.push(g.이름)});if(added.length){localStorage.setItem("nob_userdb",JSON.stringify(userDB));renderLegions();renderDB()}return added}
async function runOCR(){const shs=allShots();if(!ocrEl.checked||!shs.length||!window.Tesseract){window._ocrText="";return}try{let out=[];for(const im of shs){const{data}=await Tesseract.recognize(im.url,"kor+eng");out.push(data.text.replace(/\s+/g," ").trim())}window._ocrText=out.join(" || ")}catch(e){window._ocrText=""}}

/* ===== 대화 ===== */
let history=[],uiTurns=[];const chatEl=document.getElementById("chat");
function render(md){let h=window.marked?marked.parse(md):md.replace(/\n/g,"<br>");return window.DOMPurify?DOMPurify.sanitize(h):h}
function renderChat(){if(!uiTurns.length){chatEl.innerHTML=`<span class="hint">${t("chatEmpty")}</span>`;return}chatEl.innerHTML=uiTurns.map(x=>x.role==="user"?`<div class="bubble user">🙋 ${x.html}</div>`:`<div class="bubble ai">🧠 <div class="ai-body">${x.html}</div></div>`).join("");chatEl.scrollTop=chatEl.scrollHeight}
async function turn(btnId){const btn=document.getElementById(btnId);btn.disabled=true;uiTurns.push({role:"model",html:`<span class="spinner"></span>${t("thinking")}`});renderChat();let ok=false;try{const txt=await gemini(modelEl.value,history);history.push({role:"model",parts:[{text:txt}]});uiTurns[uiTurns.length-1]={role:"model",html:render(txt)};ok=true}catch(e){history.pop();uiTurns[uiTurns.length-1]={role:"model",html:`<span style="color:var(--red)">오류: ${e.message}</span>`}}renderChat();btn.disabled=false;return ok}
async function runAnalysis(){const cand=candEl.value,isNew=cand==="__new__";if(!cand)return alert(t("reqPick"));if(isNew&&!allShots().length)return alert(t("reqBasic"));const model=modelEl.value,btn=document.getElementById("askBtn"),addNote=document.getElementById("addNote");addNote.innerHTML="";
  if(isNew&&ocrEl.checked&&allShots().length){btn.disabled=true;addNote.innerHTML='<span class="spinner"></span>OCR...';await runOCR();addNote.innerHTML=""}
  if(isNew&&autoaddEl.checked&&allShots().length){btn.disabled=true;addNote.innerHTML='<span class="spinner"></span>…';const added=await extractAndAdd(model);if(added.length){fillCand();candEl.value=added[0]}addNote.innerHTML=added.length?`<span class="note">${t("addedTo")}${added.join(", ")}</span>`:`<span class="hint">${t("noRead")}</span>`;btn.disabled=false}
  history=[];uiTurns=[];const q=document.getElementById("q").value.trim();const parts=[{text:buildAdvicePrompt()}];if(isNew)parts.push(...imgParts());history.push({role:"user",parts});uiTurns.push({role:"user",html:`<b>${t("analReq")}${esc(candEl.value==="__new__"?"(new)":dg(findGen(candEl.value)||{이름:candEl.value},"이름"))}</b>${allShots().length?` · ${allShots().length}📷`:""}${q?"<br>"+esc(q):""}`});const ok=await turn("askBtn");if(ok)document.getElementById("followRow").style.display="block"}
async function followUp(){const inp=document.getElementById("followInput"),q=inp.value.trim();if(!q)return;if(!history.length)return alert(t("reqPick"));history.push({role:"user",parts:[{text:q+answerLang()}]});uiTurns.push({role:"user",html:esc(q)});inp.value="";renderChat();await turn("followBtn")}
async function optimize(){const by=document.getElementById("optBy").value;const prompt=`당신은 '신 노부나가의 야망' 편성 전문가입니다.\n${RULES}\n[전체 DB]\n${dbLines()}\n**${by} 병종 최적 군단(3부대×3=9명)**을 구성하세요. 3부대 모두 ${by} 주장. 주장전용 부장불가. 각 부대는 주장 스킬 테마에 맞는 부장. 무기 시너지 반영.\n출력: 부대별 표(부대|주장|부장1|부장2)+부대별 시너지 근거+총평. 마크다운.${answerLang()}`;history=[];uiTurns=[];history.push({role:"user",parts:[{text:prompt}]});uiTurns.push({role:"user",html:`<b>${t("optReq")} — ${t("c"+by)}</b>`});const ok=await turn("optBtn");if(ok)document.getElementById("followRow").style.display="block"}
document.getElementById("askBtn").addEventListener("click",runAnalysis);
document.getElementById("followBtn").addEventListener("click",followUp);
document.getElementById("followInput").addEventListener("keydown",e=>{if(e.key==="Enter")followUp()});
document.getElementById("optBtn").addEventListener("click",optimize);
function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

/* ===== DB 조회 ===== */
function renderDB(){const q=(document.getElementById("dbSearch").value||"").trim(),r=document.getElementById("dbRole").value,b=document.getElementById("dbByeong").value,sort=document.getElementById("dbSort").value;let rows=ALL().filter(g=>{if(r&&g.역할!==r)return false;if(b&&g.병종!==b)return false;if(q){const hay=[dg(g,"이름"),g.이름,dg(g,"스킬"),dg(g,"스킬효과"),dg(g,"무기"),dg(g,"무기효과")].join(" ");if(!hay.includes(q))return false}return true});if(sort==="번호")rows.sort((a,c)=>a.번호-c.번호);else rows.sort((a,c)=>c[sort]-a[sort]);document.getElementById("dbCount").textContent=ALL().length;const H=[t("thName"),t("thType"),"LDR","VAL","INT","SPD","POL",t("thSkill"),t("thWeapon"),t("thOwn"),t("thNote")];document.getElementById("dbTable").innerHTML=`<thead><tr><th>#</th>${H.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>`+rows.map(g=>{const own=g.무기보유||hasWeapon(g),wp=(!g.무기||g.무기==="없음");return `<tr><td>${g.번호}${g.출처?"*":""}</td><td><b>${dg(g,"이름")}</b></td><td>${t(g.역할==="주장"?"jusang":"busang")}${g.병종?"·"+t("c"+g.병종):""}<br><span class="muted">${g.특성}</span></td><td>${g.통솔}</td><td>${g.무용}</td><td>${g.지략}</td><td>${g.속도}</td><td>${g.정치}</td><td class="wrap"><b>${dg(g,"스킬")}</b><br><span class="muted">${esc(dg(g,"스킬효과"))}</span></td><td class="wrap">${wp?`<span class="muted">${t("no")}</span>`:"<b>"+esc(dg(g,"무기"))+"</b><br><span class=\"muted\">"+esc(dg(g,"무기효과"))+"</span>"}</td><td>${own==="보유"?`<span class="tagY">${t("yes")}</span>`:`<span class="tagN">${t("no")}</span>`}</td><td class="wrap"><span class="muted">${g.전보?esc(dg(g,"전보")):"-"}</span></td></tr>`}).join("")+`</tbody>`}
["dbSearch","dbRole","dbByeong","dbSort"].forEach(id=>{const el=document.getElementById(id);el.addEventListener("input",renderDB);el.addEventListener("change",renderDB)});

/* ===== 초기화 ===== */
applyTheme(localStorage.getItem("nob_theme")||"auto");
applyUI();renderLegions();renderDB();fillCand();
if(lang!=="ko")applyLang(lang);
</script>
</body>
</html>
